apiVersion: apps/v1
kind: Deployment
metadata:
  name: bedrock-london-local
  namespace: default
  labels:
    app.kubernetes.io/name: bedrock-london-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bedrock-london-local
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bedrock-london-local
    spec:
      containers:
        - name: bedrock-london-local
          image: docker.io/library/bedrock-london-local:local-v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: BEDROCK_LONDON_LOCAL_MODEL
              value: bedrock-anthropic-claude-4-5-opus
          envFrom:
            - secretRef:
                name: agent-mesh-environment
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
---
apiVersion: v1
kind: Service
metadata:
  name: bedrock-london-local
  namespace: default
  labels:
    app.kubernetes.io/name: bedrock-london-local
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bedrock-london-local
  ports:
    - name: http
      port: 8000
      targetPort: http
