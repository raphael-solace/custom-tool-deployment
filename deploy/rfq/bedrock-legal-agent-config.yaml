log:
  stdout_log_level: INFO
  log_file_level: INFO
  log_file: bedrock-legal-agent.log

apps:
  - name: bedrock_legal_agent
    app_base_path: .
    app_module: solace_agent_mesh.agent.sac.app
    broker:
      dev_mode: ${SOLACE_DEV_MODE, false}
      broker_url: ${SOLACE_BROKER_URL, ws://localhost:8080}
      broker_username: ${SOLACE_BROKER_USERNAME, default}
      broker_password: ${SOLACE_BROKER_PASSWORD, default}
      broker_vpn: ${SOLACE_BROKER_VPN, default}
      temporary_queue: ${USE_TEMPORARY_QUEUES, true}

    app_config:
      namespace: ${NAMESPACE}
      supports_streaming: false
      agent_name: bedrock_legal_agent
      display_name: Bedrock Legal Agent

      model:
        model: ${LLM_SERVICE_GENERAL_MODEL_NAME}
        api_base: ${LLM_SERVICE_ENDPOINT}
        api_key: ${LLM_SERVICE_API_KEY}

      instruction: |
        You are Bedrock Legal Agent.
        Help users analyze legal and compliance questions with precise, practical guidance.
        Provide grounded responses without fabricating legal facts.
        Always produce a non-empty final text response.
        Return at least three concise bullet points for legal/compliance requests unless the user asks for another format.
        If information is missing, ask one clear follow-up question and explain what is needed.
        Never return a blank or whitespace-only message.

      amazon_bedrock_runtime_config: &amazon_bedrock_runtime_config
        endpoint_url: ${BEDROCK_LONDON_LOCAL_ENDPOINT_URL, http://bedrock-london-local.default.svc.cluster.local:8000}
        boto3_config:
          region_name: ${BEDROCK_LONDON_LOCAL_AWS_REGION, us-east-1}
          aws_access_key_id: ${BEDROCK_LONDON_LOCAL_AWS_ACCESS_KEY_ID, demoAccessKey}
          aws_secret_access_key: ${BEDROCK_LONDON_LOCAL_AWS_SECRET_ACCESS_KEY, demoSecretKey}

      tools:
        - group_name: artifact_management
          tool_type: builtin-group

      session_service:
        type: sql
        database_url: ${DATABASE_URL}
        default_behavior: PERSISTENT

      artifact_service:
        type: ${ARTIFACT_SERVICE_TYPE, s3}
        bucket_name: ${S3_BUCKET_NAME}
        endpoint_url: ${S3_ENDPOINT_URL}
        aws_region: ${AWS_REGION, us-east-1}
        artifact_scope: namespace

      artifact_handling_mode: reference
      enable_embed_resolution: true
      enable_artifact_content_instruction: true

      agent_card:
        description: Legal and compliance assistant backed by a Bedrock-compatible runtime.
        defaultInputModes: [text]
        defaultOutputModes: [text]
        skills:
          - id: bedrock_legal
            name: Bedrock Legal
            description: Handles legal and compliance requests via Bedrock runtime invocation.

      agent_card_publishing:
        interval_seconds: 10

      agent_discovery:
        enabled: true

      inter_agent_communication:
        allow_list: []
        request_timeout_seconds: 120
